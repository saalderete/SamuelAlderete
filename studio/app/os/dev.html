<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The screen, on its own (test harness)</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  html, body { height: 100%; margin: 0; background: #000; }
  #os { position: absolute; inset: 0; }
  #out { position: fixed; left: 12px; bottom: 12px; z-index: 99; padding: 8px 12px; background: #f8fafc; color: #080808; font: 13px/1.3 system-ui, sans-serif; }
</style>
</head>
<body>
<!-- The mini-OS without the room, for building and testing it.
     ?t=3.5      a still frame t seconds after start-up (nothing animates)
     ?app=paint  open a program once the desktop is up (&arg=kasapro for the inventory)
     ?instant=1  skip the start-up
     ?room=1     stay inactive, as the screen is while the visitor stands in the room
     ?mini=1     draw it small and tilted through a 3D transform, as the room does -->
<div id="os"></div>
<script type="module">
  import { createOS } from "./os.js";
  import { audio } from "../audio.js";

  const q = new URLSearchParams(location.search);
  const frozen = q.has("t") ? Number(q.get("t")) : null;
  const host = {
    exit() {
      window.__exits = (window.__exits || 0) + 1;
      let n = document.getElementById("out");
      if (!n) { n = document.createElement("div"); n.id = "out"; document.body.append(n); }
      n.textContent = "host.exit() was called: here the camera would fly back to the room.";
    },
    frozen,
    reducedMotion: q.has("calm") || matchMedia("(prefers-reduced-motion: reduce)").matches,
    site: "../../../",
    assets: "../../../assets/",
  };
  if (q.has("mini")) {
    const el = document.getElementById("os");
    el.style.transformOrigin = "0 0";
    el.style.transform = "matrix3d(0.26, 0.012, 0, 0.00006, -0.01, 0.25, 0, -0.00002, 0, 0, 1, 0, 620, 300, 0, 1)";
    document.body.style.background = "#1b1612";
  }
  const os = createOS({ root: document.getElementById("os"), host });
  window.os = os; window.audio = audio;
  os.on("tint", (t) => { window.__tint = t; });
  os.on("ready", () => { window.__ready = true; });

  if (frozen != null) await os.freeze(frozen);
  else await os.boot({ instant: q.has("instant") });
  if (!q.has("room")) os.setActive(true);
  if (q.has("app")) os.open(q.get("app"), q.get("arg") ?? undefined);
  window.__up = true;
</script>
</body>
</html>
